<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>제5차 ACT NOW 전국대회</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <style>
        :root {
            --bg-overlay: rgba(250, 250, 248, 0.88);
        }
        body {
            font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
            background-color: #fafaf8;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        /* Mobile-safe fixed background */
        .bg-fixed-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), var(--bg-url);
            background-size: cover;
            background-position: center;
            background-attachment: scroll;
        }
        @media (min-width: 768px) {
            .bg-fixed-overlay { background-attachment: fixed; }
        }
        
        .markdown-content p { 
            margin-bottom: 1.5rem; 
            line-height: 1.9; 
            color: #374151; 
            word-break: keep-all;
            font-size: 1.05rem;
        }
        @media (max-width: 640px) {
            .markdown-content p { font-size: 1rem; line-height: 1.75; }
        }
        .markdown-content strong { color: #111827; font-weight: 700; }
        
        .glass-nav {
            background: rgba(250, 250, 248, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-slate-900 antialiased min-h-[100dvh]">
    <div id="bgLayer" class="bg-fixed-overlay"></div>

    <!-- Navigation -->
    <nav class="glass-nav sticky top-0 z-40 border-b border-slate-200/50">
        <div class="max-w-4xl mx-auto px-5 h-16 flex items-center justify-between">
            <div id="navTitle" class="font-bold text-base md:text-lg tracking-tight truncate mr-4">제5차 ACT NOW 전국대회</div>
            <a id="navCta" href="#" target="_blank" class="bg-slate-900 text-white px-4 py-2 rounded-full text-sm md:text-sm font-semibold hover:bg-slate-800 transition-all whitespace-nowrap hidden">참가 신청 →</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-5 py-8 md:py-20 flex flex-col gap-12 md:gap-24">
        
        <section id="sectionLogo" class="flex justify-center fade-in hidden">
            <img id="logoImg" src="" alt="ACT NOW 로고" class="max-h-24 md:max-h-40 object-contain">
        </section>

        <!-- Hero/Promo Section -->
        <section id="sectionPromo" class="bg-white/60 backdrop-blur-xl p-6 md:p-12 rounded-[2rem] border border-white/80 shadow-sm space-y-6 md:space-y-8 fade-in">
            <div class="space-y-4">
                <h1 id="promoTitle" class="text-2xl md:text-5xl font-black tracking-tight leading-tight text-slate-900">
                    로딩 중...
                </h1>
                <div id="tagContainer" class="flex flex-wrap gap-1.5 md:gap-2">
                    <span class="px-2.5 py-1 bg-slate-900/5 text-slate-600 rounded-lg text-[10px] md:text-xs font-semibold">#함께바른교회되기</span>
                    <span class="px-2.5 py-1 bg-slate-900/5 text-slate-600 rounded-lg text-[10px] md:text-xs font-semibold">#우면동교회</span>
                    <span class="px-2.5 py-1 bg-slate-900/5 text-slate-600 rounded-lg text-[10px] md:text-xs font-semibold">#5월1일</span>
                    <span class="px-2.5 py-1 bg-slate-900/5 text-slate-600 rounded-lg text-[10px] md:text-xs font-semibold">#우리가_배운교회</span>
                    <span class="px-2.5 py-1 bg-slate-900/5 text-slate-600 rounded-lg text-[10px] md:text-xs font-semibold">#BecomingChurch</span>
                </div>
            </div>
            <div id="promoBody" class="markdown-content">
                내용을 불러오고 있습니다...
            </div>
        </section>

        <section id="sectionPoster" class="flex justify-center fade-in hidden">
            <img id="posterImg" src="" alt="전국대회 포스터" class="w-full rounded-2xl md:rounded-3xl shadow-2xl shadow-slate-200/50">
        </section>

        <!-- Registration Card (Updated Button Text) -->
        <section id="sectionCta" class="bg-slate-900/95 backdrop-blur-md text-white rounded-[2.5rem] p-10 md:p-16 text-center space-y-8 fade-in hidden">
            <div class="space-y-3">
                <h3 class="text-2xl md:text-4xl font-bold tracking-tight">지금 함께 참여하세요</h3>
                <p class="text-slate-400 text-sm md:text-lg max-w-md mx-auto leading-relaxed">더딘 걸음이지만 단단하게, 우리가 배운 교회의 본질을 향해 함께 나아갑니다.</p>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                <a id="ctaBtn" href="#" target="_blank" class="w-full sm:w-auto bg-white text-slate-900 px-8 py-4 rounded-full font-bold text-base md:text-lg shadow-xl hover:bg-slate-100 transition-all active:scale-95">참가 신청하기 →</a>
                <a id="feeBtn" href="#" target="_blank" class="w-full sm:w-auto bg-indigo-600 text-white px-8 py-4 rounded-full font-bold text-base md:text-lg shadow-xl hover:bg-indigo-500 transition-all active:scale-95">참가비 1만원 →</a>
            </div>
        </section>

    </main>

    <footer class="border-t border-slate-200/50 py-10 text-center text-slate-500 text-[10px] md:text-xs tracking-wide">
        <p class="px-5"><span id="footerText">제5차 ACT NOW 전국대회</span> © <span id="footerYear"></span></p>
    </footer>

    <!-- Secret Admin Trigger (Top Left Corner Long Press) -->
    <div id="adminTrigger" class="fixed top-0 left-0 w-16 h-16 z-[100] cursor-default"></div>

    <!-- Modals -->
    <div id="loginModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[110] hidden items-center justify-center p-5">
        <div class="bg-white rounded-[2.5rem] p-8 w-full max-w-sm shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="text-4xl">🔐</div>
                <h2 class="text-xl font-bold text-slate-900 tracking-tight">관리자 인증</h2>
            </div>
            <input type="password" id="pwInput" class="w-full px-5 py-4 rounded-2xl border border-slate-200 text-center focus:ring-2 focus:ring-slate-900 outline-none text-lg" placeholder="비밀번호">
            <div id="pwError" class="text-red-500 text-sm text-center font-medium hidden">비밀번호가 올바르지 않습니다.</div>
            <div class="flex gap-3">
                <button onclick="hideModal('loginModal')" class="flex-1 py-4 bg-slate-100 rounded-2xl font-bold text-slate-600 active:scale-95 transition-transform">취소</button>
                <button onclick="tryLogin()" class="flex-1 py-4 bg-slate-900 text-white rounded-2xl font-bold active:scale-95 transition-transform">확인</button>
            </div>
        </div>
    </div>

    <div id="adminModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[120] hidden items-start justify-center p-4 overflow-y-auto">
        <div class="bg-slate-50 rounded-[2.5rem] w-full max-w-2xl shadow-2xl my-4 overflow-hidden border border-white">
            <div class="bg-slate-900 text-white p-6 md:p-8 flex justify-between items-center">
                <div>
                    <h2 class="font-bold text-xl tracking-tight">콘텐츠 관리자</h2>
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest mt-1">Cloud Sync Enabled</p>
                </div>
                <button onclick="hideModal('adminModal')" class="w-10 h-10 flex items-center justify-center bg-white/10 rounded-xl hover:bg-white/20">✕</button>
            </div>
            
            <div class="p-6 md:p-8 space-y-8">
                <!-- Site Config -->
                <div class="bg-white p-6 rounded-3xl border border-slate-200/60 space-y-5">
                    <h3 class="font-bold text-slate-900">⚙️ 기본 정보</h3>
                    <div class="space-y-4">
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">사이트 제목</label>
                            <input id="editSiteName" type="text" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">일반 신청 URL (구글 폼 등)</label>
                            <input id="editFormUrl" type="text" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">참가비 1만원 URL (도너스 등)</label>
                            <input id="editFeeFormUrl" type="text" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                        </div>
                    </div>
                </div>

                <!-- Promo Content -->
                <div class="bg-white p-6 rounded-3xl border border-slate-200/60 space-y-5">
                    <h3 class="font-bold text-slate-900">📝 홍보 텍스트</h3>
                    <div class="space-y-4">
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">메인 타이틀</label>
                            <input id="editPromoTitle" type="text" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">본문 내용</label>
                            <textarea id="editPromoText" class="w-full px-4 py-4 bg-slate-50 border border-slate-200 rounded-xl h-80 outline-none leading-relaxed"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Images -->
                <div class="space-y-4">
                    <div class="bg-white p-6 rounded-3xl border border-slate-200/60 space-y-4">
                        <h3 class="font-bold text-slate-900">🖼️ 배경 이미지</h3>
                        <div id="bgPreviewBox" class="hidden text-center"><img id="bgPreviewImg" class="max-h-32 mx-auto rounded-xl border border-slate-100"><button onclick="clearAsset('bg')" class="text-xs text-red-500 mt-2 font-semibold">삭제</button></div>
                        <label class="block p-5 border-2 border-dashed border-slate-200 rounded-2xl text-center cursor-pointer hover:bg-slate-50 active:bg-slate-100 transition-colors"><span class="text-xs text-slate-500 font-medium">배경 이미지 업로드</span><input type="file" class="hidden" accept="image/*" onchange="handleFile('bg', event)"></label>
                    </div>
                </div>

                <div class="flex gap-4 pt-4 pb-10">
                    <button id="btnSave" onclick="saveToCloud()" class="flex-1 py-5 bg-slate-900 text-white rounded-[1.5rem] font-black shadow-2xl hover:bg-slate-800 transition-all flex items-center justify-center gap-2 active:scale-95">💾 클라우드에 저장하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'act-now-landing-v5';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const DEFAULT_DATA = {
            siteName: '제5차 ACT NOW 전국대회',
            logoUrl: 'https://i.ifh.cc/WNlTmx.jpg',
            bgUrl: 'https://i.ifh.cc/VqfSVL.jpg',
            promoTitle: '우리가 배운 교회 — Becoming Church',
            promoText: `"함께 바른교회되기 ACT NOW"는 2022년 10월 31일, "건강한 공동체, 환대와 섬김, 교회의 연대, 사회적 책임, 미셔널 라이프"를 꿈꾸며 출범했습니다. 그날 이후 우리는 빠르게 달리지는 못했습니다. 그러나 단 한 번도 멈추지 않았습니다. 더딘 걸음이었기에 오히려 단단해졌습니다. 뜻을 같이하는 이들이 해를 거듭하며 꾸준히 모여들었고, 매해 두 차례 전국대회를 열어 함께 역량을 키우며 오늘 이 자리에 이르렀습니다.\n\n올해 노동절, 5월 1일. 다섯 번째 ACT NOW 전국대회가 열립니다.\n\n이번 전국대회의 전체 주제는 **"우리가 배운 교회"**입니다. "너희는 그리스도를 그같이 배우지 아니하였느니라"(엡 4:20). 이 한 구절의 말씀 앞에 우리는 다시 섭니다. 오늘날 한국교회는 예수 그리스도께서 가르치신 교회의 모습에서 너무도 멀리 떠나와 있습니다. 부패하고, 세속에 물들었습니다. 바로 이런 시대이기에 묻지 않을 수 없습니다—본래 우리가 배운 교회는 어떤 교회였는가. 이번 대회는 그 물음을 다양한 시각에서 함께 살피고, 다시 한번 마음에 새기는 시간이 될 것입니다.\n\n특별히 이번 전국대회는 이전과는 다른 방식으로 진행됩니다. 강단에서 일방적으로 듣는 대회가 아닙니다. **퍼실리테이션**을 통해 참석자 한 사람 한 사람이 토론에 직접 참여하며, 우리가 함께 걸어가야 할 교회의 길을 모색합니다. 보조 주제어인 Becoming Church는 이러한 방향을 분명히 합니다—교회가 되어간다는 것은 고정된 공간 안에 머무는 것이 아니라, 삶의 모든 현장에서 예수의 제자로 살아가며 교회의 참된 모습을 향해 끊임없이 변화해가는 과정이라는 고백입니다.\n\n시대에 역행하고, 주님의 가르침에서 스스로 멀어진 교회와 목회자들로 인해 고개를 들기조차 부끄러운 시대를 살고 있습니다. 그러나 이럴 때일수록 우리 안의 예수가 더욱 선명해져야 합니다. 개인의 이익이 아닌 교회의 공공성을 세워야 합니다. 이 일은 누군가 대신해 줄 몫이 아닙니다. 우리 모두의 책무입니다.\n\nACT NOW는 교회가 바른 길 위에 다시 설 수 있도록 최선을 다하겠습니다. 이 땅의 공동체가 진정으로 믿고 기댈 수 있는 교회가 되는 그날까지, 멈추지 않겠습니다.\n\n전국대회에 대한 자세한 내용은 아래 포스터를 참조해 주시고, 참여를 원하시는 분은 참가신청서를 작성해주세요. 고맙습니다.`,
            posterUrl: 'https://i.ifh.cc/TJjSaQ.jpg',
            googleFormUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSdoNhkxU8QsNGgC4ljNrg5l1WiHuTh7Rg90FzSgC8l-m9-yCw/viewform',
            feeFormUrl: 'https://box.donus.org/box/mercyhands/actnow'
        };

        let configData = { ...DEFAULT_DATA };
        const ADMIN_PASSWORD = 'admin2026';

        async function init() {
            const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            };
            await initAuth();

            onAuthStateChanged(auth, (user) => {
                if (!user) return;
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'web', 'landing');
                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        configData = { ...DEFAULT_DATA, ...docSnap.data() };
                        render(configData);
                    } else {
                        saveToCloud(true);
                    }
                }, (error) => console.error("Snapshot error:", error));
            });
            document.getElementById('footerYear').textContent = new Date().getFullYear();

            // Secret trigger logic: Long press on top-left area
            let pressTimer;
            const trigger = document.getElementById('adminTrigger');
            trigger.addEventListener('touchstart', () => pressTimer = setTimeout(showLogin, 3000));
            trigger.addEventListener('touchend', () => clearTimeout(pressTimer));
            trigger.addEventListener('mousedown', () => pressTimer = setTimeout(showLogin, 3000));
            trigger.addEventListener('mouseup', () => clearTimeout(pressTimer));
        }

        function render(data) {
            document.getElementById('navTitle').textContent = data.siteName;
            document.getElementById('footerText').textContent = data.siteName;
            if (data.bgUrl) document.getElementById('bgLayer').style.setProperty('--bg-url', `url('${data.bgUrl}')`);
            
            if (data.logoUrl) {
                document.getElementById('sectionLogo').classList.remove('hidden');
                document.getElementById('logoImg').src = data.logoUrl;
            }
            document.getElementById('promoTitle').textContent = data.promoTitle;
            document.getElementById('promoBody').innerHTML = parseMarkdown(data.promoText);

            if (data.posterUrl) {
                document.getElementById('sectionPoster').classList.remove('hidden');
                document.getElementById('posterImg').src = data.posterUrl;
            }

            // Buttons
            const navCta = document.getElementById('navCta');
            const ctaBtn = document.getElementById('ctaBtn');
            const feeBtn = document.getElementById('feeBtn');
            const ctaSec = document.getElementById('sectionCta');

            if (data.googleFormUrl || data.feeFormUrl) {
                ctaSec.classList.remove('hidden');
                if(data.googleFormUrl) {
                    navCta.classList.remove('hidden');
                    navCta.href = data.googleFormUrl;
                    ctaBtn.classList.remove('hidden');
                    ctaBtn.href = data.googleFormUrl;
                } else {
                    navCta.classList.add('hidden');
                    ctaBtn.classList.add('hidden');
                }

                if(data.feeFormUrl) {
                    feeBtn.classList.remove('hidden');
                    feeBtn.href = data.feeFormUrl;
                    feeBtn.textContent = "참가비 1만원 →";
                } else {
                    feeBtn.classList.add('hidden');
                }
            }
        }

        function parseMarkdown(text) {
            if (!text) return "";
            return text.trim().split(/\n\n+/).map(p => {
                let html = p.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                           .replace(/\*(.*?)\*/g, '<em>$1</em>')
                           .replace(/\n/g, '<br>');
                return `<p>${html}</p>`;
            }).join('');
        }

        window.showLogin = () => {
            document.getElementById('loginModal').classList.remove('hidden');
            document.getElementById('loginModal').classList.add('flex');
            document.getElementById('pwInput').focus();
        };

        window.hideModal = (id) => {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
        };

        window.tryLogin = () => {
            if (document.getElementById('pwInput').value === ADMIN_PASSWORD) {
                hideModal('loginModal');
                openAdmin();
            } else {
                const err = document.getElementById('pwError');
                err.classList.remove('hidden');
                setTimeout(() => err.classList.add('hidden'), 2000);
            }
        };

        function openAdmin() {
            document.getElementById('adminModal').classList.remove('hidden');
            document.getElementById('adminModal').classList.add('flex');
            document.getElementById('editSiteName').value = configData.siteName || '';
            document.getElementById('editFormUrl').value = configData.googleFormUrl || '';
            document.getElementById('editFeeFormUrl').value = configData.feeFormUrl || '';
            document.getElementById('editPromoTitle').value = configData.promoTitle || '';
            document.getElementById('editPromoText').value = configData.promoText || '';
            updatePreviews();
        }

        function updatePreviews() {
            const p = (id, url) => {
                const box = document.getElementById(id + 'PreviewBox');
                const img = document.getElementById(id + 'PreviewImg');
                if (url) { box.classList.remove('hidden'); img.src = url; }
                else { box.classList.add('hidden'); }
            };
            p('bg', configData.bgUrl);
        }

        window.handleFile = (type, e) => {
            const file = e.target.files[0];
            if (!file || file.size > 1024 * 1024) { alert("1MB 이하만 가능합니다."); return; }
            const reader = new FileReader();
            reader.onload = (ev) => {
                if (type === 'bg') configData.bgUrl = ev.target.result;
                updatePreviews();
            };
            reader.readAsDataURL(file);
        };

        window.clearAsset = (type) => {
            if (type === 'bg') configData.bgUrl = '';
            updatePreviews();
        };

        window.saveToCloud = async (isInitial = false) => {
            if (!auth.currentUser) return;
            const btn = document.getElementById('btnSave');
            if (!isInitial) {
                btn.disabled = true;
                btn.textContent = "⌛ 저장 중...";
                configData.siteName = document.getElementById('editSiteName').value;
                configData.googleFormUrl = document.getElementById('editFormUrl').value;
                configData.feeFormUrl = document.getElementById('editFeeFormUrl').value;
                configData.promoTitle = document.getElementById('editPromoTitle').value;
                configData.promoText = document.getElementById('editPromoText').value;
            }
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'web', 'landing');
                await setDoc(docRef, configData);
                if (!isInitial) {
                    btn.textContent = "✅ 저장 완료";
                    btn.classList.add('bg-green-600');
                    setTimeout(() => {
                        btn.textContent = "💾 클라우드에 저장하기";
                        btn.classList.remove('bg-green-600');
                        btn.disabled = false;
                        hideModal('adminModal');
                    }, 1000);
                } else render(configData);
            } catch (err) {
                console.error("Save error:", err);
                if (!isInitial) { alert("저장 실패"); btn.disabled = false; }
            }
        };

        document.getElementById('pwInput').onkeydown = (e) => { if(e.key === 'Enter') tryLogin(); };
        init();
    </script>
</body>
</html>
